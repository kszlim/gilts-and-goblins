<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play Gilts &amp; Goblins</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#211409;color:#f7ecd0;font:16px system-ui}body{display:flex;flex-direction:column}nav{height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#332316}nav a{color:inherit;font-size:13px}button{cursor:pointer;background:#697148;color:#fff6dc;border:1px solid #a3a66b;border-radius:4px;padding:10px 20px;font:inherit}nav button{font-size:12px;padding:5px 10px}#frame{flex:1;min-height:0;position:relative;width:100%}canvas{display:block;width:100%;height:100%;outline:none}#intro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;background:#211409}#intro p{max-width:520px;line-height:1.7;color:#cabc9a}#status{font-size:13px}a:focus-visible,button:focus-visible{outline:3px solid #ecd699;outline-offset:3px}</style></head><body><nav><a href="../">← Gilts &amp; Goblins</a><button id="fullscreen">Fullscreen</button></nav><main id="frame"><canvas id="game" tabindex="0" aria-label="Gilts and Goblins game. Mouse or touch to play; Space starts a wave and Escape pauses."></canvas><div id="intro"><h1>Gilts &amp; Goblins</h1><p>Your kingdom awaits. The first load downloads the game and its artwork. A desktop browser with hardware acceleration works best.</p><button id="start">Enter the kingdom</button><p id="status" role="status">Saves stay in this browser. No account needed.</p></div></main><script type="module">
const start = document.querySelector('#start'), status = document.querySelector('#status');
document.querySelector('#fullscreen').onclick = () => document.querySelector('#frame').requestFullscreen?.().catch(() => {});
start.onclick = async () => {
  start.disabled = true; status.textContent = 'Loading the kingdom…';
  try {
    const {default: init} = await import('./game.js');
    await init();
    document.querySelector('#intro').remove();
    document.querySelector('#game').focus();
  } catch (error) {
    console.error(error);
    status.textContent = 'The kingdom could not load. Try a current browser with hardware acceleration, or download a desktop build.';
    start.disabled = false;
  }
};
</script></body></html>
